# ¡Vamos! on the VPS: pulls the latest code from GitHub on every (re)start.
# Host nginx proxies lahav.biz -> 127.0.0.1:3001 (TLS by certbot).
services:
  app:
    image: node:22-alpine
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "3000"
      ADMIN_PIN: "${ADMIN_PIN}"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - vamos-data:/data
    command: ["sh", "-c", "rm -rf /app && mkdir -p /app && wget -qO- https://codeload.github.com/lah2k/vamos-spanish/tar.gz/refs/heads/master | tar xz -C /app --strip-components=1 && cd /app && exec node server.js"]
volumes:
  vamos-data:
